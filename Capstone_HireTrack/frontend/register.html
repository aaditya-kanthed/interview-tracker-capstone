<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | HireTrack</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body class="min-h-screen">
    <div class="grid min-h-screen lg:grid-cols-2">
      <div id="authAside" class="contents"></div>
      <div class="flex flex-col px-4 py-6 sm:px-10">
        <div id="authTop"></div>
        <main class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
          <div id="registerBox">
            <h1 class="text-3xl font-bold tracking-tight text-stone-900 dark:text-white">
              Create your account
            </h1>
            <p class="mt-2 text-stone-500 dark:text-stone-400">
              Sign up as a candidate to apply for jobs.
            </p>

            <!-- Shown only when GOOGLE_CLIENT_ID is set on the server -->
            <div id="googleBox" class="mt-8" hidden>
              <div id="googleBtn" class="flex min-h-11 justify-center"></div>
              <p class="mt-2 text-center text-xs text-stone-500 dark:text-stone-400">
                No password needed.
              </p>
              <div
                class="mt-6 flex items-center gap-3 text-xs font-medium text-stone-400 uppercase"
              >
                <span class="h-px flex-1 bg-stone-200 dark:bg-night-700"></span>
                or sign up with email
                <span class="h-px flex-1 bg-stone-200 dark:bg-night-700"></span>
              </div>
            </div>

            <form id="registerForm" class="mt-6 space-y-5" novalidate>
              <div>
                <label class="label" for="fullName">Full name</label>
                <input
                  class="input"
                  id="fullName"
                  name="fullName"
                  required
                  minlength="2"
                  maxlength="100"
                  autocomplete="name"
                />
              </div>
              <div>
                <label class="label" for="email">Email</label>
                <input
                  class="input"
                  id="email"
                  type="email"
                  name="email"
                  required
                  autocomplete="email"
                  placeholder="you@example.com"
                />
              </div>
              <div>
                <label class="label" for="password">Password</label>
                <input
                  class="input"
                  id="password"
                  type="password"
                  name="password"
                  required
                  minlength="8"
                  autocomplete="new-password"
                />
                <div class="mt-2 grid grid-cols-4 gap-1" id="strengthBars">
                  <span class="h-1 rounded bg-stone-200 dark:bg-night-700"></span>
                  <span class="h-1 rounded bg-stone-200 dark:bg-night-700"></span>
                  <span class="h-1 rounded bg-stone-200 dark:bg-night-700"></span>
                  <span class="h-1 rounded bg-stone-200 dark:bg-night-700"></span>
                </div>
                <p class="field-hint" id="strengthText">At least 8 characters.</p>
              </div>
              <button type="submit" class="btn btn-primary w-full py-2.5">Create account</button>
            </form>
            <p class="mt-8 text-center text-sm text-stone-500 dark:text-stone-400">
              Already have an account? <a href="login.html" class="link">Log in</a>
            </p>
          </div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
