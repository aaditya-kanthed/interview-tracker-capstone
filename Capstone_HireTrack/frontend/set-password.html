<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set password | HireTrack</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body class="min-h-screen">
    <div class="grid min-h-screen lg:grid-cols-2">
      <div id="authAside" class="contents"></div>
      <div class="flex flex-col px-4 py-6 sm:px-10">
        <div id="authTop"></div>
        <main class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
          <div id="formBox">
            <h1
              class="text-3xl font-bold tracking-tight text-stone-900 dark:text-white"
              id="pageTitle"
            >
              Set your password
            </h1>
            <p class="mt-2 text-stone-500 dark:text-stone-400" id="pageSubtitle">
              Your account is ready. Choose a password to log in.
            </p>
            <div
              id="missingToken"
              class="mt-6 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300"
              hidden
            >
              This link is missing its token. Please open the link from your email again.
            </div>
            <form id="passwordForm" class="mt-8 space-y-5" novalidate>
              <div>
                <label class="label" for="password">New password</label>
                <input
                  class="input"
                  id="password"
                  type="password"
                  name="password"
                  required
                  minlength="8"
                  autocomplete="new-password"
                />
                <p class="field-hint">At least 8 characters.</p>
              </div>
              <div>
                <label class="label" for="confirm">Confirm password</label>
                <input
                  class="input"
                  id="confirm"
                  type="password"
                  name="confirm"
                  required
                  minlength="8"
                  autocomplete="new-password"
                />
              </div>
              <button type="submit" class="btn btn-primary w-full py-2.5">Save password</button>
            </form>
          </div>
          <div id="doneBox" class="text-center" hidden>
            <span
              class="mx-auto grid size-14 place-items-center rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-300"
              id="doneIcon"
            ></span>
            <h1 class="mt-6 text-2xl font-bold text-stone-900 dark:text-white">Password saved</h1>
            <p class="mt-2 text-stone-500 dark:text-stone-400">
              You can now log in with your new password.
            </p>
            <a href="login.html" class="btn btn-primary mt-8">Log in</a>
          </div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/set-password.js"></script>
  </body>
</html>
