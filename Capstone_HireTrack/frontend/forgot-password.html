<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password | HireTrack</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body class="min-h-screen">
    <div class="grid min-h-screen lg:grid-cols-2">
      <div id="authAside" class="contents"></div>
      <div class="flex flex-col px-4 py-6 sm:px-10">
        <div id="authTop"></div>
        <main class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
          <div id="formBox">
            <h1 class="text-3xl font-bold tracking-tight text-stone-900 dark:text-white">
              Forgot your password?
            </h1>
            <p class="mt-2 text-stone-500 dark:text-stone-400">
              Enter the email you use to log in. We'll send you a link to choose a new password.
            </p>
            <form id="forgotForm" class="mt-8 space-y-5" novalidate>
              <div>
                <label class="label" for="email">Email</label>
                <input
                  class="input"
                  id="email"
                  type="email"
                  name="email"
                  required
                  autocomplete="email"
                  placeholder="you@example.com"
                />
              </div>
              <button type="submit" class="btn btn-primary w-full py-2.5">Send reset link</button>
            </form>
            <p class="mt-8 text-center text-sm text-stone-500 dark:text-stone-400">
              Remembered it? <a href="login.html" class="link">Back to login</a>
            </p>
          </div>

          <div id="doneBox" class="text-center" hidden>
            <span
              class="mx-auto grid size-14 place-items-center rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-300"
              id="doneIcon"
            ></span>
            <h1 class="mt-6 text-2xl font-bold text-stone-900 dark:text-white">Check your inbox</h1>
            <p class="mt-2 text-stone-500 dark:text-stone-400">
              If an account exists for
              <b id="sentTo" class="text-stone-800 dark:text-stone-200"></b>, we've sent a link to
              reset the password. It is valid for 1 hour. Check your spam folder too.
            </p>
            <a href="login.html" class="btn btn-primary mt-8">Back to login</a>
          </div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/forgot-password.js"></script>
  </body>
</html>
