<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change password | InterviewTracker</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body class="min-h-screen">
    <main class="mx-auto max-w-lg px-4 py-10 sm:px-6">
      <div
        id="firstLoginNote"
        class="mb-6 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-200"
        hidden
      >
        <p class="font-semibold">Welcome! Please choose your own password.</p>
        <p class="mt-1">
          You logged in with the temporary password from your email. Set a new password to continue.
        </p>
      </div>

      <form id="passwordForm" class="card space-y-5" novalidate>
        <div>
          <h1 class="text-xl font-bold text-stone-900 dark:text-white">Change password</h1>
          <p class="muted mt-1">
            Use at least 8 characters. A mix of letters, numbers and a symbol is safest.
          </p>
        </div>
        <div id="currentBox">
          <label class="label" for="currentPassword" id="currentLabel">Current password</label>
          <input
            class="input"
            id="currentPassword"
            type="password"
            name="currentPassword"
            autocomplete="current-password"
            required
          />
        </div>
        <div>
          <label class="label" for="newPassword">New password</label>
          <input
            class="input"
            id="newPassword"
            type="password"
            name="newPassword"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          />
        </div>
        <div>
          <label class="label" for="confirm">Confirm new password</label>
          <input
            class="input"
            id="confirm"
            type="password"
            name="confirm"
            minlength="8"
            autocomplete="new-password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-full">Save new password</button>
      </form>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/change-password.js"></script>
  </body>
</html>
